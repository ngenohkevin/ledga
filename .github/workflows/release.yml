name: Release

on:
  push:
    tags:
      - 'v*'

# R163: read-only by default; only the release job may write, to publish.
permissions:
  contents: read

jobs:
  test:
    uses: ./.github/workflows/ci.yml

  release:
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - name: Set up JDK 17
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4.9.1
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a # v4.4.3

      - name: Warm Gradle wrapper (tolerate flaky CDN)
        run: |
          for i in 1 2 3 4 5; do
            ./gradlew --version && exit 0
            echo "Gradle download attempt $i failed; retrying in $((i*20))s..."
            sleep $((i*20))
          done
          echo "Gradle distribution still unreachable after retries." >&2
          exit 1

      - name: Read the version
        id: version
        run: |
          ./gradlew -q :app:ledgaVersion | tee version.txt
          {
            echo "name=$(sed -n 's/^VERSION_NAME=//p' version.txt)"
            echo "code=$(sed -n 's/^VERSION_CODE=//p' version.txt)"
            echo "min_sdk=$(sed -n 's/^MIN_SDK=//p' version.txt)"
          } >> "$GITHUB_OUTPUT"

      # Spec §13.1: the tag must be v + VERSION_NAME.
      - name: Check the tag
        env:
          NAME: ${{ steps.version.outputs.name }}
        run: |
          if [ "$GITHUB_REF_NAME" != "v$NAME" ]; then
            echo "::error::Tag $GITHUB_REF_NAME doesn't match version.properties (v$NAME)"
            exit 1
          fi

      # Spec §13.2: every release has its notes.
      - name: Check the release notes
        env:
          NAME: ${{ steps.version.outputs.name }}
        run: |
          if [ ! -s "release-notes/$NAME.md" ]; then
            echo "::error::release-notes/$NAME.md is missing or empty"
            exit 1
          fi

      - name: Decode keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          mkdir -p keystore
          echo "$KEYSTORE_BASE64" | base64 -d > keystore/ledga-release.jks

      # R162: the password comes only from these secrets; the build has no default.
      - name: Build the release APK
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: ./gradlew :app:assembleRelease

      - name: Write the release files
        env:
          NAME: ${{ steps.version.outputs.name }}
          CODE: ${{ steps.version.outputs.code }}
          MIN_SDK: ${{ steps.version.outputs.min_sdk }}
        run: |
          python3 scripts/release_files.py --apk app/build/outputs/apk/release/app-release.apk \
            --version "$NAME" --version-code "$CODE" --min-sdk "$MIN_SDK" --out app/build/ledga-release

      # R146: the manifest must read back in the app's own parser before anything is published.
      - name: Read the manifest back with the app's parser
        run: ./gradlew :app:testDebugUnitTest --tests 'com.ledga.app.data.update.ReleaseManifestFileTest' -Pledga.releaseFiles=required

      # Spec §13.3, §13.5: betas are pre-releases (v1 phones never see them); only a full release becomes Latest.
      - name: Publish the release
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2.6.2
        with:
          files: |
            app/build/ledga-release/ledga-${{ steps.version.outputs.name }}.apk
            app/build/ledga-release/ledga-release.json
          body_path: release-notes/${{ steps.version.outputs.name }}.md
          prerelease: ${{ contains(steps.version.outputs.name, '-beta.') }}
          make_latest: ${{ contains(steps.version.outputs.name, '-beta.') && 'false' || 'true' }}
          fail_on_unmatched_files: true
