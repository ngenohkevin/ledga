name: Tests

on:
  push:
    branches: [v2, main]
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

jobs:
  test:
    # Owner call B: the screenshot goldens are recorded on an Apple-silicon Mac; macOS runners draw them the same way.
    runs-on: macos-latest
    timeout-minutes: 60
    steps:
      # R163: actions are pinned to full commit SHAs (the tag each was at is in the comment), and no checkout keeps the token.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - name: Set up JDK 17
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4.9.1
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Set up the Android SDK
        uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407 # v3.2.2

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a # v4.4.3

      # services.gradle.org intermittently times out while the wrapper fetches the distribution. Retry only the download.
      - name: Warm Gradle wrapper (tolerate flaky CDN)
        run: |
          for i in 1 2 3 4 5; do
            ./gradlew --version && exit 0
            echo "Gradle download attempt $i failed; retrying in $((i*20))s..."
            sleep $((i*20))
          done
          echo "Gradle distribution still unreachable after retries." >&2
          exit 1

      - name: Unit and screenshot tests (goldens compared)
        run: ./gradlew :core:test :app:testDebugUnitTest -Proborazzi.test.verify=true

      - name: Keep the reports and the screenshot differences
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: test-reports
          path: |
            core/build/reports/tests
            app/build/reports/tests
            app/build/outputs/roborazzi
          if-no-files-found: ignore
