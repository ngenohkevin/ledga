name: Tests

on:
  push:
    branches: [v2, main]
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

jobs:
  test:
    # Owner call B: the screenshot goldens are recorded on an Apple-silicon Mac; macOS runners draw them the same way.
    runs-on: macos-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Set up the Android SDK
        uses: android-actions/setup-android@v3

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      # services.gradle.org intermittently times out while the wrapper fetches the distribution. Retry only the download.
      - name: Warm Gradle wrapper (tolerate flaky CDN)
        run: |
          for i in 1 2 3 4 5; do
            ./gradlew --version && exit 0
            echo "Gradle download attempt $i failed; retrying in $((i*20))s..."
            sleep $((i*20))
          done
          echo "Gradle distribution still unreachable after retries." >&2
          exit 1

      - name: Unit and screenshot tests (goldens compared)
        run: ./gradlew :core:test :app:testDebugUnitTest -Proborazzi.test.verify=true

      - name: Keep the reports and the screenshot differences
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: |
            core/build/reports/tests
            app/build/reports/tests
            app/build/outputs/roborazzi
          if-no-files-found: ignore
